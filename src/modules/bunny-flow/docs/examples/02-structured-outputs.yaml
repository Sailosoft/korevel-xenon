# =============================================================================
# Example 2: Structured Outputs Pipeline (v2)
# Demonstrates: named output fields (plain, number, json_array, markdown),
#               granular cross-step references, partial input consumption
# =============================================================================
name: Data Analysis Pipeline
# semanticVersion is now optional
# semanticVersion: 1.0.0
description: >
  Analyze a dataset and extract structured fields (insight, score, keywords),
  then generate targeted downstream reports using only the fields they need.

# Default output type for all steps (optional, defaults to "markdown")
outputType: markdown

variables:
  - name: dataset_description
    value: "Customer survey responses Q1 2025"
    # type is now optional (defaults to "text")
    # type: text
    description: Description of the dataset to analyze

  - name: min_score_threshold
    value: "70"
    # type: number
    description: Minimum sentiment score to consider positive

# Agents are now optional. slug removed — use name as identifier. role is optional.
agents:
  - name: analyst
    role: Data Analyst
    prompt: >
      You are a data analyst specializing in survey data.
      You extract precise, structured insights from raw data.

  - name: reporter
    role: Report Generator
    prompt: >
      You are a report generator. You produce clean summaries
      based on structured data inputs.

jobs:
  - name: analysis
    prompt: Analyze the dataset and extract structured outputs
    agent: analyst
    steps:
      - name: analyze_survey
        prompts: |
          Analyze the "{{dataset_description}}" dataset.
          Return a JSON object with:
          - insight: a one-paragraph plain-text summary
          - score: a numeric satisfaction score (0-100)
          - keywords: a JSON array of 5 key terms found
        agent: analyst
        inputs:
          - name: dataset_description
            source: vars.dataset_description
        # Structured output: name + optional type (defaults to markdown)
        output:
          - name: insight
            type: plain
          - name: score
            type: number
          - name: keywords
            type: json_array

  - name: reporting
    prompt: Generate targeted reports from structured analysis
    agent: reporter
    needs: analysis
    steps:
      - name: generate_summary
        prompts: |
          Using the analysis results from the survey:

          Insight: "{{insight_text}}"
          Score: {{score_value}}

          Generate a one-paragraph executive summary in markdown format.
        agent: reporter
        inputs:
          - name: insight_text
            source: analysis.analyze_survey.outputs.insight
          - name: score_value
            source: analysis.analyze_survey.outputs.score
        # Output type is optional — defaults to workflow-level outputType (markdown)
        output:
          - name: summary
            # type defaults to "markdown"

      - name: list_keywords
        prompts: |
          Here are the keywords from the analysis: {{keywords_list}}

          Format them as a bullet-point markdown list with brief descriptions.
        agent: reporter
        inputs:
          - name: keywords_list
            source: analysis.analyze_survey.outputs.keywords
        output:
          - name: keyword_list
            # type defaults to "markdown"

      - name: final_report
        prompts: |
          Combine the summary and keyword list into a final markdown report.

          Summary:
          "{{summary_content}}"

          Keywords:
          "{{keywords_formatted}}"
        agent: reporter
        inputs:
          - name: summary_content
            source: reporting.generate_summary.outputs.summary
          - name: keywords_formatted
            source: reporting.list_keywords.outputs.keyword_list
