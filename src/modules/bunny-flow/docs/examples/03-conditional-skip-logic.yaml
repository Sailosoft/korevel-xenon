# =============================================================================
# Example 3: Conditional Execution & Skip Logic (v2)
# Demonstrates: skipIf conditions, multiple job dependencies (needs as array),
#               boolean variables, dynamic step skipping based on input values
# =============================================================================
name: Conditional Review Pipeline
# semanticVersion is now optional
# semanticVersion: 1.0.0
description: >
  A code/PR review pipeline that conditionally executes steps based on
  variable values. If no issues are found, the remediation step is skipped.

outputType: markdown

variables:
  - name: pr_title
    value: "feat: add user authentication module"
    # type optional, defaults to "text"
    description: The title of the pull request

  - name: code_complexity
    value: "medium"
    # type: select
    description: Estimated code complexity (low/medium/high)

  - name: require_security_review
    value: "true"
    # type: text
    description: Whether to perform a security audit

# Agents — slug removed, role optional
agents:
  - name: reviewer
    role: Code Reviewer
    prompt: >
      You are a senior software engineer conducting a thorough
      code review. You identify bugs, security issues, and
      performance bottlenecks.

  - name: security
    role: Security Auditor
    prompt: >
      You are a security expert who audits code for vulnerabilities.
      You follow OWASP guidelines.

  - name: writer
    role: Technical Writer
    prompt: >
      You are a technical writer who documents code changes
      clearly for both developers and stakeholders.

jobs:
  - name: review
    prompt: Review the pull request code changes
    agent: reviewer
    steps:
      - name: analyze_code
        prompts: |
          Review the PR titled "{title}" with {complexity} complexity.
          Identify:
          1. Code quality issues
          2. Potential bugs
          3. Performance concerns
          Return "NO_ISSUES" if everything looks clean, otherwise
          list each issue found.
        agent: reviewer
        output:
          - name: review_verdict
            type: plain
          - name: issue_count
            type: number

      - name: security_audit
        prompts: |
          Perform a security audit on the code in PR "{title}".
          Check for:
          - Injection vulnerabilities
          - Authentication weaknesses
          - Data exposure risks
        agent: security
        skipIf:
          - inputs: perform_audit
            condition: "=="
            value: false
        inputs:
          - name: perform_audit
            source: vars.require_security_review
          - name: code_context
            source: review.analyze_code.outputs.__raw__

  - name: remediation
    prompt: Fix issues found during review
    agent: reviewer
    needs: review
    steps:
      - name: fix_issues
        prompts: |
          Based on the review findings, provide specific code fixes
          for each issue identified.
        agent: reviewer
        skipIf:
          - inputs: verdict
            condition: "=="
            value: "NO_ISSUES"
        inputs:
          - name: verdict
            source: review.analyze_code.outputs.review_verdict
          - name: issues
            source: review.analyze_code.outputs.__raw__

  - name: documentation
    prompt: Document the PR changes
    agent: writer
    needs:
      - review
      - remediation
    steps:
      - name: generate_changelog
        prompts: |
          Write a changelog entry for PR "{title}" at {complexity}
          complexity. Include:
          - Summary of changes
          - Issues found and fixed
          - Security considerations
        agent: writer
        inputs:
          - name: title
            source: vars.pr_title
          - name: complexity
            source: vars.code_complexity
          - name: review_findings
            source: review.analyze_code.outputs.__raw__
          - name: sec_findings
            source: review.security_audit.outputs.__raw__
