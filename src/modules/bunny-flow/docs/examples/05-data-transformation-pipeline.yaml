# =============================================================================
# Example 5: Data Transformation & Export Pipeline (v2)
# Demonstrates: diverse output types (json, yaml, csv, html), chained
#               transformations, multiple prompts per step, structured
#               inputs flowing through a multi-stage ETL-like workflow
# =============================================================================
name: Data Transformation Pipeline
# semanticVersion is now optional
# semanticVersion: 1.0.0
description: >
  An ETL-style pipeline that ingests raw data, transforms it into
  multiple structured formats (JSON, YAML, CSV, HTML), and produces
  a final compiled report. Demonstrates rich output typing.

outputType: markdown

variables:
  - name: source_data_description
    value: "Monthly sales data for Q1 2025 across 4 regions"
    description: Description of the raw data to process

  - name: currency
    value: "USD"
    description: Currency for financial figures

  - name: include_charts
    value: "true"
    description: Whether to include chart placeholders in HTML output

agents:
  - name: engineer
    role: Data Engineer
    prompt: >
      You are a data engineer. You transform raw data into
      structured formats and ensure data integrity.

  - name: analyst
    role: Business Analyst
    prompt: >
      You are a business analyst. You derive insights from data
      and present them in clear, actionable formats.

  - name: publisher
    role: Report Publisher
    prompt: >
      You are a report publisher. You compile data from multiple
      sources into comprehensive, well-formatted documents.

jobs:
  - name: ingestion
    prompt: Ingest and validate raw data
    agent: engineer
    steps:
      - name: parse_data
        prompts: |
          Parse the following data source: "{data_source}".
          Identify:
          1. Number of records
          2. Key fields (dates, amounts, regions)
          3. Data quality issues (missing values, outliers)
        agent: engineer
        output:
          - name: record_count
            type: number
          - name: fields_identified
            type: json_array
          - name: quality_report
            type: plain

      - name: validate_data
        prompts: |
          Validate the parsed data based on these criteria:
          - All records have required fields
          - Numeric values are positive
          - Dates are in valid range

          Quality report: "{quality}"

          Return PASS or FAIL with details.
        agent: engineer
        inputs:
          - name: quality
            source: ingestion.parse_data.outputs.quality_report
        output:
          - name: validation_result
            type: plain
          - name: error_count
            type: number

  - name: transformation
    prompt: Transform data into multiple formats
    agent: analyst
    needs: ingestion
    steps:
      - name: to_json
        prompts: |
          Using the validated data, create a JSON representation.
          Include all records with their fields aggregated by region.
        agent: analyst
        inputs:
          - name: parsed
            source: ingestion.parse_data.outputs.__raw__
          - name: validation
            source: ingestion.validate_data.outputs.__raw__
        output:
          - name: json_output
            type: json

      - name: to_yaml
        prompts: |
          Convert the same data to YAML format.
          Use the JSON output as the source.

          JSON data: "{json_data}"
        agent: analyst
        inputs:
          - name: json_data
            source: transformation.to_json.outputs.json_output
        output:
          - name: yaml_output
            type: yaml

      - name: to_csv
        prompts: |
          Flatten the data into CSV format with these columns:
          Region, Month, Revenue, Expenses, Profit, Currency
          Use {currency} for all monetary values.

          Source data: "{json_data}"
        agent: analyst
        inputs:
          - name: json_data
            source: transformation.to_json.outputs.json_output
          - name: currency
            source: vars.currency
        output:
          - name: csv_output
            type: csv

  - name: publishing
    prompt: Compile final report
    agent: publisher
    needs: transformation
    steps:
      - name: generate_html_report
        prompts: |
          Create an HTML report that includes:
          1. Executive summary
          2. Data quality section
          3. JSON data view (collapsible)
          4. YAML data view (collapsible)
          5. CSV data table
          6. Key metrics dashboard
          Include chart placeholders if {charts_enabled}.

          JSON: {json}
          YAML: {yaml}
          CSV: {csv}
        agent: publisher
        inputs:
          - name: json
            source: transformation.to_json.outputs.json_output
          - name: yaml
            source: transformation.to_yaml.outputs.yaml_output
          - name: csv
            source: transformation.to_csv.outputs.csv_output
          - name: charts_enabled
            source: vars.include_charts
        output:
          - name: html_report
            type: html

      - name: generate_summary
        prompts: |
          Generate a markdown executive summary that covers:
          1. Data ingestion results ({records} records processed)
          2. Validation findings
          3. Transformation outputs (JSON, YAML, CSV)
          4. Key business insights

          Keep it concise but comprehensive.
        agent: publisher
        inputs:
          - name: records
            source: ingestion.parse_data.outputs.record_count
          - name: validation
            source: ingestion.validate_data.outputs.__raw__
          - name: json
            source: transformation.to_json.outputs.json_output
        output:
          - name: summary_md
            # type defaults to "markdown"
